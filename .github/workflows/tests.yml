name: CPU tests

on:
  push:
    branches: [main, joss]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and test dependencies
        run: python -m pip install dist/*.whl pytest
      - name: Check installed dependencies
        run: python -m pip check
      - name: Test the installed package outside the source directory
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "$GITHUB_WORKSPACE/tests" -q --import-mode=importlib
